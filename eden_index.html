<!DOCTYPE html>
<html lang="zh-CN" style="margin:0;padding:0;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.tailwindcss.com"></script>
</head>
<body style="margin:0;padding:0;font-family:'Microsoft YaHei','微软雅黑',sans-serif;">
<div id="app" style="min-height:800px;position:relative;overflow:hidden;"></div>
<script>
(function(){
  var s = document.createElement('style');
  s.textContent = `
    :root {
      --bg-primary: #0a1628;
      --bg-secondary: #0d1f3c;
      --bg-card: rgba(13, 31, 60, 0.7);

    }
    * { box-sizing: border-box; }
    body { background: var(--bg-primary); color: var(--text-primary); overflow-x: hidden; }

        radial-gradient(ellipse at 20% 80%, rgba(79, 195, 247, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0a1628 0%, #0d1f3c 50%, #0a1628 100%);

    @keyframes shoot { 0% { transform: translate(0,0); opacity: 1; } 100% { transform: translate(300px,300px); opacity: 0; } }
    .orbit-container { position: relative; width: 320px; height: 320px; margin: 0 auto; }
    .orbit-ring {
      position: absolute; top: 50%; left: 50%; border: 1px solid var(--border-glow);
      border-radius: 50%; transform: translate(-50%, -50%); animation: rotate 30s linear infinite;
    }
    .orbit-ring-1 { width: 280px; height: 280px; animation-duration: 25s; }
    .orbit-ring-2 { width: 240px; height: 240px; animation-duration: 20s; animation-direction: reverse; }
    .orbit-ring-3 { width: 200px; height: 200px; animation-duration: 15s; }
    @keyframes rotate { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }
    .orbit-text { position: absolute; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; color: var(--accent-divine); text-transform: uppercase; }
    .orbit-text-1 { top: -8px; left: 50%; transform: translateX(-50%); }
    .orbit-text-2 { bottom: -8px; left: 50%; transform: translateX(-50%); }
    .orbit-text-3 { left: -8px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
    .orbit-text-4 { right: -8px; top: 50%; transform: translateY(-50%) rotate(90deg); }
    .divine-emblem {

    .emblem-cross { font-size: 42px; color: var(--accent-sky); text-shadow: 0 0 20px var(--accent-sky); font-family: 'Cinzel', serif; }

    .btn-secondary:hover { border-color: var(--accent-sky); color: var(--accent-sky); }
    .btn-gold { background: linear-gradient(135deg, rgba(212,175,55,0.3), rgba(79,195,247,0.2)); border: 1px solid var(--accent-gold); color: var(--text-primary); }
    .btn-small { padding: 6px 14px; font-size: 12px; width: auto; letter-spacing: 1px; }

    }
    .page-title {

        radial-gradient(ellipse at 70% 50%, rgba(212,175,55,0.15) 0%, transparent 60%),

    }
    .hall-subtitle { font-size: 18px; color: var(--text-secondary); letter-spacing: 4px; font-style: italic; }
    .stat-card { text-align: center; padding: 24px; }
    .stat-value { font-family: 'Cinzel', serif; font-size: 36px; font-weight: 700; color: var(--accent-sky); text-shadow: 0 0 20px rgba(79,195,247,0.5); }
    .stat-label { font-size: 14px; color: var(--text-secondary); letter-spacing: 2px; margin-top: 8px; font-family: 'Cinzel', serif; }
    .eden-table { width: 100%; border-collapse: collapse; }

    }
    .eden-table td { padding: 14px 16px; border-bottom: 1px solid var(--border-soft); color: var(--text-primary); font-size: 14px; }
    .eden-table tr:hover td { background: rgba(79,195,247,0.05); }
    .divine-select {
      width: 100%; padding: 14px 18px; background: rgba(10,22,40,0.6);
      border: 1px solid var(--border-soft); border-radius: 8px; color: var(--text-primary);
      font-size: 15px; font-family: 'Cormorant Garamond', serif; cursor: pointer; outline: none;
    }
    .divine-select:focus { border-color: var(--accent-sky); box-shadow: 0 0 15px rgba(79,195,247,0.2); }
    .upload-zone { border: 2px dashed var(--border-soft); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent-sky); background: rgba(79,195,247,0.05); }
    .upload-preview { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 12px; border: 1px solid var(--border-glow); }
    .status-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-family: 'Cinzel', serif; letter-spacing: 1px; }
    .status-pending { background: rgba(212,175,55,0.2); border: 1px solid var(--accent-gold); color: var(--accent-gold); }
    .status-approved { background: rgba(79,195,247,0.2); border: 1px solid var(--accent-sky); color: var(--accent-sky); }
    .status-rejected { background: rgba(244,67,54,0.2); border: 1px solid #f44336; color: #f44336; }

    .avatar-container:hover { box-shadow: 0 0 20px rgba(79,195,247,0.5); transform: scale(1.05); }
    .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, var(--accent-sky), var(--accent-gold)); display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 28px; color: var(--bg-primary); }
    .avatar-edit-hint { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white; font-size: 10px; text-align: center; padding: 4px; opacity: 0; transition: opacity 0.3s; }
    .avatar-container:hover .avatar-edit-hint { opacity: 1; }
    .user-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; padding: 20px 24px; background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 12px; backdrop-filter: blur(10px); flex-wrap: wrap; gap: 16px; }
    .user-info { display: flex; align-items: center; gap: 20px; }
    .user-details h3 { font-family: 'Cinzel', serif; font-size: 20px; color: var(--text-primary); margin: 0 0 4px 0; }
    .user-details p { margin: 0; color: var(--text-secondary); font-size: 14px; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
    .modal-content { background: var(--bg-secondary); border: 1px solid var(--border-glow); border-radius: 16px; padding: 32px; max-width: 550px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .modal-content h3 { font-family: 'Cinzel', serif; color: var(--accent-divine); margin-top: 0; letter-spacing: 2px; }
    .toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; background: var(--bg-secondary); border: 1px solid var(--accent-sky); border-radius: 8px; color: var(--text-primary); z-index: 2000; animation: slideIn 0.3s ease; box-shadow: 0 4px 20px rgba(79,195,247,0.3); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .admin-badge { display: inline-block; padding: 4px 10px; background: linear-gradient(135deg, var(--accent-gold), var(--accent-sky)); border-radius: 4px; font-size: 11px; font-family: 'Cinzel', serif; color: var(--bg-primary); font-weight: 700; letter-spacing: 1px; }
    .admin-action-btn { padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; border: none; font-family: 'Cinzel', serif; margin-right: 6px; transition: all 0.2s; }
    .admin-approve { background: rgba(79,195,247,0.2); color: var(--accent-sky); border: 1px solid var(--accent-sky); }
    .admin-approve:hover { background: rgba(79,195,247,0.4); }
    .admin-reject { background: rgba(244,67,54,0.2); color: #f44336; border: 1px solid #f44336; }
    .admin-reject:hover { background: rgba(244,67,54,0.4); }
    .tab-btn { padding: 10px 20px; background: transparent; border: 1px solid var(--border-soft); border-bottom: none; border-radius: 8px 8px 0 0; color: var(--text-secondary); cursor: pointer; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 1px; margin-right: 4px; margin-bottom: -1px; transition: all 0.3s; }
    .tab-btn.active { background: var(--bg-card); border-color: var(--accent-sky); color: var(--accent-sky); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-sky); }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    .formation-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; max-width: 600px; margin: 0 auto; }
    .formation-slot { aspect-ratio: 1; border: 2px dashed var(--border-soft); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: default; transition: all 0.3s; background: rgba(10,22,40,0.4); position: relative; }
    .formation-slot.admin-editable { cursor: pointer; }
    .formation-slot.admin-editable:hover { border-color: var(--accent-sky); background: rgba(79,195,247,0.1); }
    .formation-slot.filled { border-style: solid; border-color: var(--accent-gold); background: rgba(212,175,55,0.1); }
    .formation-slot .slot-label { font-size: 11px; color: var(--text-secondary); font-family: 'Cinzel', serif; margin-top: 4px; }
    .formation-slot .slot-remove { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; background: rgba(244,67,54,0.8); border-radius: 50%; color: white; font-size: 12px; display: none; align-items: center; justify-content: center; cursor: pointer; line-height: 1; }
    .formation-slot.admin-editable:hover .slot-remove { display: flex; }
    td.rank-1 { color: #ffd700; font-weight: 700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    td.rank-2 { color: #c0c0c0; font-weight: 700; }
    td.rank-3 { color: #cd7f32; font-weight: 700; }
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-tab { padding: 8px 18px; background: transparent; border: 1px solid var(--border-soft); border-radius: 20px; color: var(--text-secondary); cursor: pointer; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 1px; transition: all 0.3s; }
    .filter-tab:hover { border-color: var(--accent-sky); color: var(--accent-sky); }
    .filter-tab.active { background: linear-gradient(135deg, rgba(79,195,247,0.2), rgba(212,175,55,0.15)); border-color: var(--accent-gold); color: var(--accent-gold); }
    .attr-hp { color: var(--accent-red); }
    .attr-atk { color: var(--accent-orange); }
    .attr-power { color: var(--accent-gold); }
    .formation-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .formation-card { background: rgba(10,22,40,0.6); border: 1px solid var(--border-soft); border-radius: 10px; padding: 16px; cursor: pointer; transition: all 0.3s; }
    .formation-card:hover { border-color: var(--accent-sky); }
    .formation-card.active { border-color: var(--accent-gold); background: rgba(212,175,55,0.08); }
    .formation-card h4 { margin: 0 0 8px 0; font-family: 'Cinzel', serif; color: var(--accent-divine); font-size: 15px; }
    .formation-card p { margin: 0; color: var(--text-secondary); font-size: 12px; }
    .readonly-hint { padding: 10px 16px; background: rgba(255,167,38,0.1); border: 1px solid rgba(255,167,38,0.3); border-radius: 8px; color: var(--accent-orange); font-size: 13px; margin-bottom: 16px; }
    .data-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    * { font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', 'Noto Sans SC', sans-serif !important; }
    /* 桌面端隐藏移动端退出按钮 */
    .btn-mobile-logout { display: none; }
    /* ===== 手机端适配 ===== */
    @media (max-width: 768px) {
      * { -webkit-tap-highlight-color: transparent; }

        position: fixed; top: 0; left: 0; right: 0; width: 100%; height: auto;
        display: flex; align-items: center; overflow-x: auto; overflow-y: hidden;
        border-right: none; border-bottom: 1px solid var(--border-soft);
        padding: env(safe-area-inset-top) 0 0 0;
        -webkit-overflow-scrolling: touch; z-index: 120;
        scrollbar-width: none; -ms-overflow-style: none;
        background: rgba(7, 18, 34, 0.97);
        box-shadow: 0 4px 24px rgba(0,0,0,0.45);
      }
      .sidebar::-webkit-scrollbar { display: none; }
      .sidebar > div:first-child { display: none; }
      /* 手机端顶部导航条去掉「离开乐园」（移到用户信息区） */
      .sidebar > div:last-child { display: none !important; }
      .btn-mobile-logout { display: inline-block !important; }
      .nav-item { flex: 0 0 auto; padding: 14px 14px 12px; border-left: none; border-bottom: 3px solid transparent; min-height: 48px; }
      .nav-item:hover { border-left-color: transparent; border-bottom-color: var(--accent-sky); }
      .nav-item.active { border-left-color: transparent; border-bottom-color: var(--accent-gold); background: rgba(79,195,247,0.12); }
      .nav-icon { width: 22px; min-width: 22px; height: 22px; }
      .nav-label { margin-left: 8px; font-size: 12px; }
      .main-content { margin-left: 0; padding: calc(78px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom)); }
      .m-shell { padding: calc(16px + env(safe-area-inset-top)) 12px 24px !important; }
      .m-stats { grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; }
      .eden-card { padding: 16px; }
      .page-title { font-size: 20px; letter-spacing: 2px; }
      .section-title { font-size: 15px; }
      .hall-hero { padding: 28px 16px; margin-bottom: 18px; }
      .hall-title { font-size: 24px; letter-spacing: 3px; }
      .hall-subtitle { font-size: 13px; letter-spacing: 2px; }
      .user-header { padding: 14px; margin-bottom: 18px; }
      .user-info { gap: 12px; }
      .user-details h3 { font-size: 16px; }
      .user-details p { font-size: 13px; }

      .stat-card { padding: 14px; }

      .stat-label { font-size: 12px; }

      .eden-table th, .eden-table td { padding: 10px 12px; font-size: 13px; }
      .modal-overlay { align-items: flex-end; }
      .modal-content { padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); width: 94%; max-width: 94%; max-height: 88vh; border-radius: 16px 16px 0 0; }
      .toast { left: 12px; right: 12px; top: calc(62px + env(safe-area-inset-top)); text-align: center; }
      .tab-btn { padding: 8px 12px; font-size: 12px; }

      .btn-secondary { padding: 9px 14px; font-size: 13px; }
      .data-actions { gap: 8px; }
      .filter-tab { padding: 7px 14px; font-size: 12px; }
      .formation-cards { grid-template-columns: 1fr; }
      .upload-zone { padding: 24px 12px; }
      .orbit-container { transform: scale(0.72); margin: -30px auto; }
      .admin-action-btn { margin-bottom: 4px; display: inline-block; }

  function createStarfield() {
    var html = '<div class="starfield">';
    for(var i = 0; i < 60; i++) { var size = Math.random() * 2 + 1; html += '<div class="star" style="width:' + size + 'px;height:' + size + 'px;top:' + Math.random() * 100 + '%;left:' + Math.random() * 100 + '%;animation-delay:' + Math.random() * 3 + 's;"></div>'; }

  // ===== 记住账号密码（base64 混淆存储，兼容中文） =====
  function _enc(s) { try { return btoa(unescape(encodeURIComponent(s))); } catch(e) { return ''; } }
  function _dec(s) { try { return decodeURIComponent(escape(atob(s))); } catch(e) { return ''; } }
  function loadRemember(key) {
    try {
      var s = localStorage.getItem(key);
      if(!s) return null;
      var d = JSON.parse(s);
      if(d && d.u !== undefined) { d.u = _dec(d.u); if(d.p !== undefined) d.p = _dec(d.p); return d; }
    } catch(e) {}
    return null;
  }
  function saveRemember(key, u, p) {
    try {
      if(u) localStorage.setItem(key, JSON.stringify({ u: _enc(u), p: _enc(p || '') }));
      else localStorage.removeItem(key);
    } catch(e) {}
  }

  async function handleAuth() {
    var username = document.getElementById('authUsername').value.trim();
    var password = document.getElementById('authPassword').value;
    if(!username || !password) { showToast('请填写完整信息', 'error'); return; }
    if(state.authMode === 'login') {
      try {
        var res = await apiFetch('/api/login', { username: username, password: password, machine: getDeviceFingerprint(), deviceType: getDeviceType() }, { noRedirect: true });
        var data = await res;
        if(data.ok) {
          var remCb = document.getElementById('rememberAuth');
          if(remCb) { if(remCb.checked) saveRemember('eden_remember', username, password); else localStorage.removeItem('eden_remember'); }
          var users = DB.getUsers();
          var idx = users.findIndex(function(u) { return u.username === data.user.username; });
          if(idx === -1) users.push(data.user); else users[idx] = data.user;
          DB.saveUsers(users);
          DB.setCurrentUser(data.user);
          setToken(data.token);
          showToast('欢迎回到伊甸园，' + data.user.username + '！', 'success'); snapshotDonateRank();
          IS_ADMIN_SITE ? renderAdmin() : renderMain();
        } else showToast(data.error || '用户名或密码错误', 'error');
      } catch(e) { showToast('网络错误，请稍后再试', 'error'); }
    } else {
      var code = document.getElementById('regCode').value.trim().toUpperCase();
      var gameId = document.getElementById('regGameId').value.trim();
      var confirmPwd = document.getElementById('regConfirmPwd').value;
      if(!code || !gameId || !confirmPwd) { showToast('请填写完整信息', 'error'); return; }
      if(password !== confirmPwd) { showToast('两次密码输入不一致', 'error'); return; }
      try {
        var res = await apiFetch('/api/register', { username: username, gameId: gameId, password: password, code: code, machine: getDeviceFingerprint(), deviceType: getDeviceType() }, { noRedirect: true });
        var data = await res;
        if(data.ok) {
          var codes = DB.getActivationCodes();
          var ci = codes.findIndex(function(c) { return c.code === code; });
          if(ci !== -1) { codes[ci].used = true; codes[ci].usedBy = username; codes[ci].usedAt = new Date().toISOString(); }
          else codes.push({ code: code, used: true, usedBy: username, usedAt: new Date().toISOString(), createdAt: new Date().toISOString(), createdBy: 'system' });
          DB.saveActivationCodes(codes);
          var users = DB.getUsers(); users.push(data.user); DB.saveUsers(users);
          DB.setCurrentUser(data.user);
          setToken(data.token);
          showToast('注册成功！欢迎加入伊甸园公会！', 'success'); renderMain();
        } else showToast(data.error || '注册失败', 'error');
      } catch(e) { showToast('网络错误，请稍后再试', 'error'); }
    }
  }

  function changeAvatar() {
    var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
    input.onchange = function(e) {
      var file = e.target.files[0]; if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        // 压缩图片：最大 256px，JPEG 0.8 质量，防止超大 dataURL 撑爆 localStorage
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var max = 256;
          var w = img.width, h = img.height;
          if (w > h && w > max) { h = h * max / w; w = max; }
          else if (h >= w && h > max) { w = w * max / h; h = max; }
          canvas.width = Math.round(w); canvas.height = Math.round(h);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          var smallData = canvas.toDataURL('image/jpeg', 0.8);
          if (smallData.length > 400000) { showToast('图片仍过大，请换一张更小的图片', 'error'); return; }
          var user = DB.getCurrentUser();
          apiFetch('/api/user-update', { username: user.username, avatar: smallData }).then(function(d) {
              if(d.ok) {
                user.avatar = smallData;
                var users = DB.getUsers(); var idx = users.findIndex(function(u) { return u.username === user.username; });
                if(idx !== -1) { users[idx] = user; DB.saveUsers(users); }
                DB.setCurrentUser(user); showToast('头像已更新', 'success'); renderMain();
              } else showToast(d.error || '头像更新失败', 'error');
            }).catch(function() { showToast('网络错误，请稍后再试', 'error'); });
        };
        img.onerror = function() { showToast('图片解析失败', 'error'); };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  function setBuildingLv(type) {

    var FIXED_HOLY_MATS = ['公会水晶', '公会金币', '神圣刻印', '青金石', '红石', '铁锭', '金锭'];
    // 圣冠/圣杖固定材料：水晶/金币/神圣刻印/远古刻印/青金石/红石/铁锭/金锭
    var FIXED_ROYAL_MATS = ['公会水晶', '公会金币', '神圣刻印', '远古刻印', '青金石', '红石', '铁锭', '金锭'];
    // 建设大厅固定材料：水晶/金币/公会令牌/绿宝石/钻石/金锭/铁锭/石英
    var FIXED_HALL_MATS = ['公会水晶', '公会金币', '公会令牌', '绿宝石', '钻石', '金锭', '铁锭', '石英'];
    function fixedRow(mat) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-top:8px;';

    else if(type === 'defense' || type === 'shield') fixedMats = FIXED_HOLY_MATS;
    else if(type === 'crown' || type === 'staff') fixedMats = FIXED_ROYAL_MATS;

    document.getElementById('cancelUpgradeBtn').addEventListener('click', function() { modal.remove(); });
    document.getElementById('confirmUpgradeBtn').addEventListener('click', function() {

  function upgradeBuilding(type, costs, errEl) {
    apiFetch('/api/building', { type: type, costs: costs }).then(function(d) {
        if(d.ok) {
          localStorage.setItem('eden_building', JSON.stringify(d.building));
          if(d.vault) localStorage.setItem('eden_vault', JSON.stringify(d.vault));
          var lvEl = document.getElementById(type === 'tower' ? 'towerLv' : type === 'hall' ? 'hallLv' : ('branchLv-' + type));
          if(lvEl) lvEl.textContent = 'Lv.' + (type === 'tower' ? d.building.tower : type === 'hall' ? d.building.hall : ((d.building.magic || {})[type] || 1));
          var fm = document.getElementById('upgradeFormModal');
          if(fm) fm.remove();
          showToast((type === 'tower' ? '魔法塔' : type === 'hall' ? '建设大厅' : branchName(type)) + '升级成功！材料已扣除', 'success');
        }
        else {
          if(d.error === '资源不足') {
            var miss = d.missing || {};
            var missTxt = Object.keys(miss).map(function(k) { return k + ' 缺 ' + miss[k]; }).join('，');
            if(errEl) errEl.textContent = '公会金库资源不足：' + missTxt;
            else showToast('资源不足：' + missTxt, 'error');
          } else if(errEl) errEl.textContent = d.error || '升级失败';
            else showToast(d.error || '升级失败', 'error');
        }
      }).catch(function() { if(errEl) errEl.textContent = '网络错误，请稍后再试'; else showToast('网络错误，请稍后再试', 'error'); });
  }

  function saveVaultFromDom() {
    var items = {};
    var inputs = document.querySelectorAll('#pageContent input[id^="vault-input-"]');
    for(var i = 0; i < inputs.length; i++) {
      var name = inputs[i].getAttribute('data-name');
      var n = parseInt(inputs[i].value, 10);
      if(name) items[name] = isNaN(n) || n < 0 ? 0 : n;
    }
    apiFetch('/api/vault', { items: items }).then(function(d) {
        if(d.ok) {
          // 先直接写入本地（立即生效，切换页面也显示新值），再同步服务器
          var cur = DB.getVault() || {};
          for(var k in items) cur[k] = items[k];
          localStorage.setItem('eden_vault', JSON.stringify(cur));
          state.vaultDirty = false;
          showToast('金库已保存', 'success');
          refreshFromServer();
        }
        else showToast(d.error || '保存失败', 'error');
      }).catch(function() { showToast('网络错误，请稍后再试', 'error'); });
  }

  function cancelVaultSave() {

  // 金库：修改数量后点击页面其他位置 → 弹保存确认
  document.addEventListener('click', function(e) {
    if(IS_ADMIN_SITE || !state.vaultDirty) return;
    var t = e.target;
    if(!t || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
    if(t.closest && t.closest('.modal-overlay')) return;
    if(t.closest && t.closest('[data-del-vault]')) return;
    if(t.id === 'toggleBuildingBtn') return;

  function renderDonateRank(container) {

    else if(state.donateRankPeriod === 'month') filteredDonations = allDonations.filter(function(d) { return isThisMonth(d.createdAt); });
    function calcRankings(donations) { var totals = {}; donations.forEach(function(d) { if(!totals[d.username]) totals[d.username] = { total: 0, gold: 0, crystal: 0 }; var amt = parseInt(d.amount) || 0; totals[d.username].total += amt; if(d.type === '金币') totals[d.username].gold += amt; else if(d.type === '水晶') totals[d.username].crystal += amt; }); return Object.keys(totals).map(function(u) { return { username: u, total: totals[u].total, gold: totals[u].gold, crystal: totals[u].crystal }; }).sort(function(a,b) { return b.total - a.total; }); }

    container.innerHTML = `

      `</select></div>` : '') + `

    var cnt = (m1 ? 1 : 0) + (m2 ? 1 : 0);

    return html;
  }

  function unbindMachine(btn) {
    var username = btn.getAttribute('data-unbind');
    var device = btn.getAttribute('data-device') || 'all';
    var label = device === '1' ? '设备1' : device === '2' ? '设备2' : '全部设备';
    if(!confirm('确定解绑「' + username + '」的' + label + '吗？')) return;
    apiFetch('/api/admin/unbind-machine', { username: username, device: device }).then(function(d) {
        if(d.ok) { showToast('已解绑「' + username + '」的' + label, 'success'); refreshFromServer(); }
        else showToast(d.error || '解绑失败', 'error');
      }).catch(function() { showToast('网络错误，请稍后再试', 'error'); });
  }

  function allowDevice(btn) {
    var username = btn.getAttribute('data-allow-device');
    if(!confirm('授权「' + username + '」的新设备登录？授权后该设备将绑定为第二台设备（电脑+手机各一台）。')) return;
    apiFetch('/api/admin/allow-device', { username: username }).then(function(d) {
        if(d.ok) { showToast('已授权「' + username + '」的新设备，客户可重新登录', 'success'); refreshFromServer(); }
        else showToast(d.error || '授权失败', 'error');
      }).catch(function() { showToast('网络错误，请稍后再试', 'error'); });
  }
  
  function renderAdminDonations(container) {
    var donations = DB.getDonations().sort(function(a,b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    container.innerHTML = `<h3 class="section-title">❤ 捐献审核</h3>` + (donations.length === 0 ? '<p style="color:var(--text-secondary);text-align:center;padding:30px;">暂无捐献记录</p>' :
    `<table class="eden-table"><thead><tr><th>会员</th><th>类型</th><th>数量</th><th>凭证</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead><tbody>` + donations.map(function(d) {
      return '<tr><td style="font-weight:600;">' + d.username + '</td><td>' + d.type + '</td><td style="color:var(--accent-gold);">' + parseInt(d.amount).toLocaleString() + '</td><td><img src="' + d.image + '" style="width:50px;height:50px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--border-soft);" class="view-image" data-src="' + d.image + '"></td><td>' + new Date(d.createdAt).toLocaleString('zh-CN') + '</td><td><span class="status-pill status-' + d.status + '">' + (d.status === 'approved' ? '已批准' : d.status === 'rejected' ? '已拒绝' : '待审核') + '</span></td><td>' + (d.status === 'pending' ? '<button class="admin-action-btn admin-approve" data-approve="' + d.id + '">批准</button><button class="admin-action-btn admin-reject" data-reject="' + d.id + '">拒绝</button>' : '<span style="color:var(--text-secondary);font-size:12px;">已处理</span>') + '<button class="admin-action-btn admin-reject" data-del-donation="' + d.id + '" style="margin-left:6px;">删除</button></td></tr>';
    }).join('') + `</tbody></table>`) + ``;
  }
  
  function viewImage(src) {
    var modal = document.createElement('div'); modal.className = 'modal-overlay'; modal.onclick = function(e) { if(e.target === modal) modal.remove(); };
    modal.innerHTML = '<div style="max-width:90%;max-height:90%;"><img src="' + src + '" style="max-width:100%;max-height:80vh;border-radius:8px;border:2px solid var(--accent-sky);"></div>';
    document.body.appendChild(modal);
  }
  
function deleteReviewRecord(kind, id) {
    if(!confirm('确定删除这条记录吗？此操作不可撤销。')) return;
    apiFetch('/api/admin/review', { kind: kind, id: parseInt(id, 10), status: 'deleted' }).then(function(d) {
        if(d.ok) { showToast('记录已删除', 'success'); refreshFromServer(); }
        else showToast(d.error || '删除失败', 'error');
      }).catch(function() { showToast('网络错误，请稍后再试', 'error'); });
  }

  function reviewRecord(kind, id, status) {
    apiFetch('/api/admin/review', { kind: kind, id: id, status: status }).then(function(d) {
        if(d.ok) { showToast(status === 'approved' ? '已批准' : '已拒绝', 'success'); refreshFromServer(); }
        else showToast(d.error || '操作失败', 'error');
      }).catch(function() { showToast('网络错误，请稍后再试', 'error'); });
  }

  function approveDonation(id) { reviewRecord('donations', id, 'approved'); }

  function rejectDonation(id) {
    if(!confirm('确定要拒绝这条捐献吗？')) return;
    reviewRecord('donations', id, 'rejected');
  }
  
  function renderAdminPower(container) {
    var reports = DB.getPowerReports().sort(function(a,b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    container.innerHTML = `<h3 class="section-title">⚔ 评分审核</h3>` + (reports.length === 0 ? '<p style="color:var(--text-secondary);text-align:center;padding:30px;">暂无评分上报记录</p>' :
    `<table class="eden-table"><thead><tr><th>会员</th><th>游戏ID</th><th>职业</th><th>评分</th><th>血量</th><th>攻击力</th><th>备注</th><th>上报时间</th><th>状态</th><th>操作</th></tr></thead><tbody>` + reports.map(function(r) {
      return '<tr><td style="font-weight:600;">' + r.username + '</td><td>' + r.gameId + '</td><td>' + r.profession + '</td><td class="attr-power">' + parseInt(r.power).toLocaleString() + '</td><td class="attr-hp">' + (r.hp ? parseInt(r.hp).toLocaleString() : '-') + '</td><td class="attr-atk">' + (r.atk ? parseInt(r.atk).toLocaleString() : '-') + '</td><td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (r.note || '-') + '</td><td>' + new Date(r.createdAt).toLocaleDateString('zh-CN') + '</td><td><span class="status-pill status-' + r.status + '">' + (r.status === 'approved' ? '已批准' : r.status === 'rejected' ? '已拒绝' : '待审核') + '</span></td><td>' + (r.status === 'pending' ? '<button class="admin-action-btn admin-approve" data-approve-power="' + r.id + '">批准</button><button class="admin-action-btn admin-reject" data-reject-power="' + r.id + '">拒绝</button>' : '<span style="color:var(--text-secondary);font-size:12px;">已处理</span>') + '<button class="admin-action-btn admin-reject" data-del-power="' + r.id + '" style="margin-left:6px;">删除</button></td></tr>';
    }).join('') + `</tbody></table>`) + ``;
  }
  
  function approvePower(id) { reviewRecord('power', id, 'approved'); }

  function rejectPower(id) {
    if(!confirm('确定要拒绝这条评分上报吗？')) return;
    reviewRecord('power', id, 'rejected');
  }
  
  function renderAdminCodes(container) {
    var codes = DB.getActivationCodes();
    container.innerHTML = `<h3 class="section-title">🔑 激活码管理</h3>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="btn-divine btn-small" id="genCodeBtn">生成新激活码</button>
        <button class="btn-divine btn-small" id="addCodeBtn">添加激活码</button>
        <button class="btn-divine btn-small" id="batchAddCodeBtn">批量添加</button>
        <button class="btn-divine btn-small" id="batchGenCodeBtn">批量生成</button>
      </div>
      <div id="batchGenWrap" style="display:none;margin-bottom:12px;padding:12px;background:rgba(13,31,60,0.5);border:1px solid var(--border-soft);border-radius:8px;">
        <span style="color:var(--text-secondary);font-size:13px;">生成数量：</span>
        <input type="number" id="batchGenCount" class="divine-input" min="1" max="500" value="10" style="width:100px;display:inline-block;">
        <span style="color:var(--text-secondary);font-size:12px;">（1-500 个，随机生成 EDEN- 格式激活码）</span>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button class="btn-divine btn-small" id="batchGenConfirm">确认生成</button>
          <button class="btn-divine btn-small" id="batchGenCancel">取消</button>
        </div>
      </div>
      <div id="codeInputWrap" style="display:none;margin-bottom:12px;padding:12px;background:rgba(13,31,60,0.5);border:1px solid var(--border-soft);border-radius:8px;">
        <textarea id="codeInputArea" class="divine-input" rows="3" style="width:100%;box-sizing:border-box;" placeholder="输入激活码，每行一个（支持批量粘贴）&#10;例如：&#10;EDEN-ABC12345&#10;EDEN-XYZ67890"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button class="btn-divine btn-small" id="codeInputConfirm">确认添加</button>
          <button class="btn-divine btn-small" id="codeInputCancel">取消</button>
        </div>
      </div>
      <table class="eden-table"><thead><tr><th>激活码</th><th>状态</th><th>使用者</th><th>生成时间</th><th>使用时间</th><th>操作</th></tr></thead><tbody>` + codes.slice().reverse().map(function(c) {
      return '<tr><td style="font-family:monospace;letter-spacing:2px;color:' + (c.used ? 'var(--text-secondary)' : 'var(--accent-gold)') + ';cursor:pointer;" title="点击复制" data-copy-code="' + c.code + '">' + c.code + '</td><td>' + (c.used ? '<span class="status-pill status-rejected">已使用</span>' : '<span class="status-pill status-approved">未使用</span>') + '</td><td>' + (c.usedBy || '-') + '</td><td>' + new Date(c.createdAt).toLocaleDateString('zh-CN') + '</td><td>' + (c.usedAt ? new Date(c.usedAt).toLocaleDateString('zh-CN') : '-') + '</td><td><button class="admin-action-btn admin-reject" data-del-code="' + c.code + '">删除</button></td></tr>';
    }).join('') + `</tbody></table>`;
  }

  function toggleCodeInput() {
    var wrap = document.getElementById('codeInputWrap');
    if(wrap) { var show = wrap.style.display === 'none'; wrap.style.display = show ? 'block' : 'none'; if(show) document.getElementById('codeInputArea').focus(); }
  }

  function toggleBatchGenInput() {
    var wrap = document.getElementById('batchGenWrap');
    if(wrap) { var show = wrap.style.display === 'none'; wrap.style.display = show ? 'block' : 'none'; if(show) document.getElementById('batchGenCount').focus(); }
  }

  function batchGenCodes() {
    var countInput = document.getElementById('batchGenCount');
    var count = parseInt(countInput ? countInput.value : '', 10);
    if(!count || count < 1 || count > 500) { showToast('请输入 1-500 之间的数量', 'error'); return; }
    apiFetch('/api/admin/gen-codes', { count: count }).then(function(d) {
        if(d.ok) { showToast('已批量生成 ' + d.added + ' 个激活码', 'success'); refreshFromServer(); }
        else showToast(d.error || '生成失败', 'error');
      }).catch(function() { showToast('网络错误，请稍后再试', 'error'); });
  }

  function addCodesManually() {
    var area = document.getElementById('codeInputArea');
    var raw = (area ? area.value : '').trim();
    if(!raw) { showToast('请输入激活码', 'error'); return; }
    var lines = raw.split(/[\r\n,，;；\s]+/).filter(function(x) { return x; });
    apiFetch('/api/admin/add-codes', { codes: lines }).then(function(d) {
        if(d.ok) { showToast('已添加 ' + d.added + ' 个激活码', 'success'); refreshFromServer(); }
        else showToast(d.error || '添加失败', 'error');
      }).catch(function() { showToast('网络错误，请稍后再试', 'error'); });
  }

  function copyCode(code) {
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch(e) { }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function() { showToast('已复制：' + code, 'success'); }, function() { fallbackCopy(code); showToast('已复制：' + code, 'success'); });
    } else { fallbackCopy(code); showToast('已复制：' + code, 'success'); }
  }

  function deleteCode(code) {
    var codes = DB.getActivationCodes();
    var idx = -1;
    for(var i = 0; i < codes.length; i++) { if(codes[i].code === code) { idx = i; break; } }
    if(idx === -1) { showToast('激活码不存在', 'error'); return; }
    if(codes[idx].used && !confirm('该激活码已被 ' + (codes[idx].usedBy || '') + ' 使用，确定删除？')) return;
    apiFetch('/api/admin/del-code', { code: code }).then(function(d) {
        if(d.ok) { showToast('激活码已删除', 'success'); refreshFromServer(); }
        else showToast(d.error || '删除失败', 'error');
      }).catch(function() { showToast('网络错误，请稍后再试', 'error'); });
  }
  
  function generateNewCode() {
    apiFetch('/api/admin/gen-codes', { count: 1 }).then(function(d) {
        if(d.ok) { showToast('新激活码已生成', 'success'); refreshFromServer(); }
        else showToast(d.error || '生成失败', 'error');
      }).catch(function() { showToast('网络错误，请稍后再试', 'error'); });
  }
  
  setupGlobalHandlers();
  
  var currentUser = DB.getCurrentUser();
  if(IS_ADMIN_SITE) { renderAdminLogin(); }
  else if(currentUser) { renderMain(); }
  else { renderLogin(); }
})();
</script>
</body>
</html>
